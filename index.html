<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://pumpresource.us https://www.pumpresource.us">
<title>Dean RA Pump Selector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #141414;
  --muted: #5c5c5c;
  --line: #e4e4e4;
  --amber: #FCB02C;
  --white: #ffffff;
  --sans: "Exo", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
}
button, input, select { font-family: inherit; color: inherit; }
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 36px 28px 72px;
}
header h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.lede {
  margin: 8px 0 0;
  max-width: 38rem;
  color: var(--ink);
  font-size: 16px;
}
.by {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
}
.layout {
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr);
  gap: 40px;
  align-items: start;
  margin-top: 32px;
}
.field { margin: 0 0 14px; }
.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
}
.field input,
.field select {
  width: 100%;
  background: var(--white);
  border: 1px solid #cfcfcf;
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 16px;
}
.field select { background: var(--white); }
.select-btn {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 12px 16px;
  border: 0;
  border-radius: 4px;
  background: var(--amber);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
}
.select-btn:hover { filter: brightness(0.96); }
.select-btn:focus-visible,
.chip:focus-visible,
.field input:focus-visible,
.field select:focus-visible,
details summary:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.chip.active {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--ink);
  font-weight: 600;
}
.err {
  min-height: 1.2em;
  margin: 10px 0 0;
  font-size: 14px;
}
.rec-kicker {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.rec-lead {
  margin: 6px 0 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.rec-lead .size { font-weight: 700; }
.rec-trim, .rec-meta, .note {
  margin: 10px 0 0;
  font-size: 15px;
}
.note { color: var(--ink); }
.note.quiet { color: var(--muted); font-size: 14px; }
.chart-wrap {
  margin-top: 18px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.chart-wrap canvas {
  display: block;
  width: 100%;
  height: 440px;
}
details { margin-top: 14px; }
details summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}
th, td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
}
th { font-weight: 600; }
@media (max-width: 800px) {
  .page { padding: 24px 16px 48px; }
  header h1 { font-size: 26px; }
  .layout { grid-template-columns: 1fr; gap: 28px; }
  .rec-lead { font-size: 24px; }
  .chart-wrap canvas { height: 320px; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Dean RA Pump Selector</h1>
    <p class="lede">Recommend one Dean RA frame from the flow, head, fluid, and temperature you enter.</p>
    <p class="by">Powered by HydroSuite</p>
  </header>
  <div class="layout">
    <form id="duty" action="#">
      <div class="field">
        <label for="sel-q">Flow (gpm)</label>
        <input id="sel-q" type="number" min="0" step="any" inputmode="decimal" placeholder="80">
      </div>
      <div class="field">
        <label for="sel-h">Head (ft)</label>
        <input id="sel-h" type="number" min="0" step="any" inputmode="decimal" placeholder="130">
      </div>
      <div class="field">
        <label for="sel-fluid">Fluid</label>
        <select id="sel-fluid">
          <optgroup label="Water">
            <option value="water" selected>Water @ 20°C / 68°F  (SG=1.000, μ=1.002 cP)</option>
            <option value="water60">Water @ 60°C / 140°F  (SG=0.983, μ=0.467 cP)</option>
            <option value="water80">Water @ 80°C / 176°F  (SG=0.972, μ=0.354 cP)</option>
            <option value="water100">Water @ 100°C / 212°F  (SG=0.958, μ=0.282 cP)</option>
            <option value="water121">Water @ 121°C / 250°F  (SG=0.943, μ=0.230 cP)</option>
            <option value="water150">Water @ 150°C / 302°F  (SG=0.917, μ=0.183 cP)</option>
            <option value="water180">Water @ 180°C / 356°F  (SG=0.887, μ=0.150 cP)</option>
            <option value="condensate">Steam Condensate @ 90°C  (SG=0.965, μ=0.314 cP)</option>
            <option value="seawater">Seawater @ 20°C  (SG=1.025, μ=1.072 cP)</option>
          </optgroup>
          <optgroup label="Glycol / Antifreeze">
            <option value="eg30">Ethylene Glycol 30% @ 20°C  (SG=1.055, μ=2.50 cP)</option>
            <option value="eg50">Ethylene Glycol 50% @ 20°C  (SG=1.085, μ=4.50 cP)</option>
            <option value="eg50c">Ethylene Glycol 50% @ -10°C  (SG=1.095, μ=11.5 cP)</option>
            <option value="pg30">Propylene Glycol 30% @ 20°C  (SG=1.034, μ=2.80 cP)</option>
            <option value="pg50">Propylene Glycol 50% @ 20°C  (SG=1.057, μ=7.50 cP)</option>
          </optgroup>
          <optgroup label="Thermal / Heat Transfer Fluids">
            <option value="dowthermA">Dowtherm A @ 150°C  (SG=0.980, μ=0.910 cP)</option>
            <option value="dowthermA260">Dowtherm A @ 260°C  (SG=0.899, μ=0.430 cP)</option>
            <option value="dowthermQ">Dowtherm Q @ 100°C  (SG=0.960, μ=1.650 cP)</option>
            <option value="dowthermQ200">Dowtherm Q @ 200°C  (SG=0.893, μ=0.680 cP)</option>
            <option value="therminol55">Therminol 55 @ 100°C  (SG=0.847, μ=1.200 cP)</option>
            <option value="therminol66">Therminol 66 @ 150°C  (SG=0.963, μ=1.850 cP)</option>
            <option value="therminol66h">Therminol 66 @ 300°C  (SG=0.856, μ=0.560 cP)</option>
            <option value="therminolVP1">Therminol VP-1 @ 200°C  (SG=0.973, μ=0.510 cP)</option>
            <option value="syltherm800">Syltherm 800 @ 200°C  (SG=0.820, μ=0.540 cP)</option>
            <option value="syltherm800h">Syltherm 800 @ 350°C  (SG=0.726, μ=0.280 cP)</option>
            <option value="xlt">Syltherm XLT @ -40°C  (SG=0.985, μ=12.00 cP)</option>
            <option value="mineralOil100">Mineral Oil HTF @ 100°C  (SG=0.840, μ=5.500 cP)</option>
            <option value="mineralOil200">Mineral Oil HTF @ 200°C  (SG=0.780, μ=1.800 cP)</option>
          </optgroup>
          <optgroup label="Hydrocarbons">
            <option value="crude">Light Crude Oil  (SG=0.870, μ=5.00 cP)</option>
            <option value="crudemed">Medium Crude Oil  (SG=0.900, μ=15.0 cP)</option>
            <option value="diesel">Diesel / No.2 Fuel Oil  (SG=0.850, μ=3.00 cP)</option>
            <option value="fo6">Fuel Oil No.6  (SG=0.990, μ=300 cP)</option>
            <option value="gasoline">Gasoline  (SG=0.720, μ=0.50 cP)</option>
            <option value="jetA">Jet Fuel A  (SG=0.800, μ=1.50 cP)</option>
            <option value="isovg32">Lube Oil ISO VG 32  (SG=0.860, μ=32.0 cP)</option>
            <option value="isovg68">Lube Oil ISO VG 68  (SG=0.870, μ=68.0 cP)</option>
          </optgroup>
          <optgroup label="Chemicals">
            <option value="hcl">HCl 20%  (SG=1.100, μ=1.60 cP)</option>
            <option value="sulfuric">H₂SO₄ 98%  (SG=1.840, μ=26.0 cP)</option>
            <option value="sulfuric10">H₂SO₄ 10%  (SG=1.065, μ=1.30 cP)</option>
            <option value="naoh">NaOH 10%  (SG=1.110, μ=1.50 cP)</option>
            <option value="methanol">Methanol  (SG=0.791, μ=0.59 cP)</option>
            <option value="ethanol">Ethanol  (SG=0.789, μ=1.20 cP)</option>
            <option value="ammonia">Liquid Ammonia @ -33°C  (SG=0.610, μ=0.16 cP)</option>
          </optgroup>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="field">
        <label for="sel-t">Temperature (°F)</label>
        <input id="sel-t" type="number" step="any" inputmode="decimal" value="68">
      </div>
      <button class="select-btn" id="sel-go" type="submit">SELECT PUMP</button>
      <div class="chips" id="presets">
        <button class="chip" type="button" data-ex="80,130">80 gpm · 130 ft</button>
        <button class="chip" type="button" data-ex="80,147">80 gpm · 147 ft</button>
        <button class="chip" type="button" data-ex="500,90">500 gpm · 90 ft</button>
        <button class="chip" type="button" data-ex="40,800">40 gpm · 800 ft</button>
      </div>
      <p class="err" id="sel-err" role="status"></p>
    </form>
    <section id="result" aria-live="polite">
      <p class="rec-kicker">Recommendation</p>
      <p class="rec-lead" id="rec-lead">Enter a duty.</p>
      <p class="rec-trim" id="rec-trim"></p>
      <p class="rec-meta" id="rec-meta"></p>
      <div id="rec-notes">
        <p class="note">This catalog does not include pumps larger than 10 in, so a better Dean size may exist above that.</p>
      </div>
      <div class="chart-wrap" id="sel-chart-wrap" hidden>
        <canvas id="sel-canvas"></canvas>
      </div>
      <div id="sel-points"></div>
    </section>
  </div>
</div>
<script src="dean-ra-select.js"></script>
<script>
var DEAN_CATALOG = null;
var DEAN_LAST = null;
var LIMIT_NOTE = 'This catalog does not include pumps larger than 10 in, so a better Dean size may exist above that.';

function selNum(id) {
  var el = document.getElementById(id);
  if (!el || el.value === '') return null;
  var n = Number(el.value);
  return isFinite(n) ? n : null;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
  });
}
function fluidLabel() {
  var opt = document.getElementById('sel-fluid').selectedOptions[0];
  var text = opt ? opt.textContent : '';
  var cut = text.indexOf('(');
  return (cut > 0 ? text.slice(0, cut) : text).trim();
}
function syncChips() {
  var q = document.getElementById('sel-q').value;
  var h = document.getElementById('sel-h').value;
  document.querySelectorAll('[data-ex]').forEach(function (btn) {
    var p = btn.getAttribute('data-ex').split(',');
    btn.classList.toggle('active', p[0] === String(q) && p[1] === String(h));
  });
}
function runDeanSelect() {
  var err = document.getElementById('sel-err');
  err.textContent = '';
  var q = selNum('sel-q'), h = selNum('sel-h'), t = selNum('sel-t');
  var fluid = document.getElementById('sel-fluid').value;
  syncChips();
  if (!DEAN_CATALOG) { err.textContent = 'Catalog is still loading.'; return; }
  if (q == null || h == null || t == null) { err.textContent = 'Enter flow, head, and temperature.'; return; }
  if (q <= 0 || h <= 0) { err.textContent = 'Flow and head need to be greater than zero.'; return; }
  DEAN_LAST = {
    result: DeanRA.select(DEAN_CATALOG, {q_gpm: q, h_ft: h}),
    q: q, h: h, t: t, fluid: fluid
  };
  renderDeanSelection();
}
function renderDeanSelection() {
  var lead = document.getElementById('rec-lead');
  var trim = document.getElementById('rec-trim');
  var meta = document.getElementById('rec-meta');
  var notes = document.getElementById('rec-notes');
  var points = document.getElementById('sel-points');
  var wrap = document.getElementById('sel-chart-wrap');
  var result = DEAN_LAST.result;
  var q = DEAN_LAST.q, h = DEAN_LAST.h, t = DEAN_LAST.t, fluid = DEAN_LAST.fluid;
  var limit = '<p class="note">' + esc(LIMIT_NOTE) + '</p>';
  var fluidLine = '<p class="note">' + esc(DeanRA.fluidNote(fluid)) + '</p>';
  if (!result.covered) {
    wrap.hidden = true;
    points.innerHTML = '';
    lead.textContent = 'No curve in this catalog covers this duty.';
    trim.textContent = q + ' gpm at ' + h + ' ft is outside every digitized Dean RA line.';
    meta.textContent = fluidLabel() + ' at ' + t + ' °F.';
    notes.innerHTML = limit + fluidLine;
    return;
  }
  var hit = result.pick;
  var curve = hit.curve;
  var frame = DeanRA.powerFrame(curve);
  wrap.hidden = false;
  lead.innerHTML = esc(frame) + ' <span class="size">' + esc(curve.size) + '</span>';
  trim.textContent = DeanRA.impellerLabel(hit);
  meta.textContent = q + ' gpm at ' + h + ' ft · ' + curve.rpm + ' rpm · ' + fluidLabel() + ' at ' + t + ' °F.';
  var extra = '';
  if (hit.inferred) {
    extra += '<p class="note quiet">This part of the line uses a point marked inferred. It was read through a label or a crossing, about ±3 ft.</p>';
  }
  extra += '<p class="note quiet">Sheet note: NPSH ' + esc(curve.npsh_ft_note) + ' ft. That is the note printed on the sheet, not an NPSHr curve.</p>';
  if (curve.rpm_note) extra += '<p class="note quiet">' + esc(curve.rpm_note) + '</p>';
  notes.innerHTML = limit + fluidLine + extra;
  points.innerHTML = renderPointTable(curve);
  drawDeanSelection();
}
function renderPointTable(curve) {
  var rows = '';
  curve.impellers.forEach(function (imp) {
    imp.points.forEach(function (p) {
      rows += '<tr><td>' + esc(DeanRA.formatDia(imp.diameter_in)) + '</td><td>' + esc(p.q_gpm) + '</td><td>' + esc(p.h_ft) + '</td><td>' +
        (p.inferred ? 'inferred ±3 ft' : 'read') + '</td></tr>';
    });
  });
  return '<details><summary>Catalog points for this size</summary>' +
    '<table><thead><tr><th>Dia in</th><th>gpm</th><th>ft</th><th>Read</th></tr></thead><tbody>' +
    rows + '</tbody></table></details>';
}
function drawDeanSelection() {
  if (!DEAN_LAST || !DEAN_LAST.result.covered) return;
  var canvas = document.getElementById('sel-canvas');
  var parent = canvas.parentElement;
  if (!canvas || !parent) return;
  var hit = DEAN_LAST.result.pick;
  var qDuty = DEAN_LAST.q, hDuty = DEAN_LAST.h;
  var curve = hit.curve;
  var dpr = window.devicePixelRatio || 1;
  var cssW = parent.clientWidth || 640;
  var cssH = window.matchMedia('(max-width: 800px)').matches ? 320 : 440;
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cssW, cssH);

  var samples = betweenSamples(hit);
  var maxQ = qDuty, maxH = hDuty;
  curve.impellers.forEach(function (imp) {
    imp.points.forEach(function (p) {
      if (p.q_gpm > maxQ) maxQ = p.q_gpm;
      if (p.h_ft > maxH) maxH = p.h_ft;
    });
  });
  samples.forEach(function (p) {
    if (p.q > maxQ) maxQ = p.q;
    if (p.h > maxH) maxH = p.h;
  });
  maxQ = maxQ * 1.08;
  maxH = maxH * 1.12;
  var pad = {l: 58, r: 28, t: 28, b: 42};
  var pw = cssW - pad.l - pad.r, ph = cssH - pad.t - pad.b;
  function X(q) { return pad.l + (q / maxQ) * pw; }
  function Y(h) { return pad.t + ph - (h / maxH) * ph; }

  ctx.strokeStyle = '#ececec';
  ctx.fillStyle = '#141414';
  ctx.font = '12px Exo, Helvetica, sans-serif';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var gq = maxQ * i / 4, gh = maxH * i / 4;
    ctx.beginPath(); ctx.moveTo(X(gq), pad.t); ctx.lineTo(X(gq), pad.t + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, Y(gh)); ctx.lineTo(pad.l + pw, Y(gh)); ctx.stroke();
    ctx.fillText(String(Math.round(gq)), X(gq) - 10, pad.t + ph + 16);
    ctx.fillText(String(Math.round(gh)), 6, Y(gh) + 4);
  }
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, pad.t + ph);
  ctx.lineTo(pad.l + pw, pad.t + ph);
  ctx.stroke();
  ctx.fillText('gpm', pad.l + pw - 28, cssH - 8);
  ctx.save();
  ctx.translate(14, pad.t + 36);
  ctx.fillText('ft', 0, 0);
  ctx.restore();

  var highlight = {};
  highlight[hit.upperDiameter] = true;
  if (hit.lowerDiameter != null) highlight[hit.lowerDiameter] = true;

  curve.impellers.forEach(function (imp) {
    var pts = imp.points.slice().sort(function (a, b) { return a.q_gpm - b.q_gpm; });
    var hot = !!highlight[imp.diameter_in];
    ctx.lineWidth = hot ? 2.25 : 1.15;
    ctx.strokeStyle = hot ? '#141414' : '#8a8a8a';
    ctx.globalAlpha = 1;
    for (var s = 0; s < pts.length - 1; s++) {
      ctx.beginPath();
      ctx.setLineDash((pts[s].inferred || pts[s + 1].inferred) ? [5, 4] : []);
      ctx.moveTo(X(pts[s].q_gpm), Y(pts[s].h_ft));
      ctx.lineTo(X(pts[s + 1].q_gpm), Y(pts[s + 1].h_ft));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    pts.forEach(function (p) {
      ctx.beginPath();
      ctx.fillStyle = p.inferred ? '#ffffff' : (hot ? '#141414' : '#8a8a8a');
      ctx.strokeStyle = hot ? '#141414' : '#8a8a8a';
      ctx.lineWidth = 1.25;
      ctx.arc(X(p.q_gpm), Y(p.h_ft), p.inferred ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    var last = pts[pts.length - 1];
    ctx.fillStyle = hot ? '#141414' : '#5c5c5c';
    ctx.fillText(DeanRA.formatDia(imp.diameter_in) + ' in', X(last.q_gpm) + 6, Y(last.h_ft) - 6);
  });

  if (samples.length > 1) {
    ctx.beginPath();
    ctx.setLineDash([7, 4]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#141414';
    samples.forEach(function (p, i) {
      if (i === 0) ctx.moveTo(X(p.q), Y(p.h));
      else ctx.lineTo(X(p.q), Y(p.h));
    });
    ctx.stroke();
    ctx.setLineDash([]);
    var mid = samples[Math.floor(samples.length / 2)];
    ctx.fillStyle = '#141414';
    ctx.fillText(DeanRA.formatDia(hit.diameter_in) + ' in trim', X(mid.q) + 8, Y(mid.h) - 8);
  }

  ctx.beginPath();
  ctx.fillStyle = '#FCB02C';
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 1.5;
  ctx.arc(X(qDuty), Y(hDuty), 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#141414';
  ctx.fillText('duty', X(qDuty) + 10, Y(hDuty) - 10);
  ctx.fillStyle = '#5c5c5c';
  ctx.fillText('Open circles are inferred points (±3 ft).', pad.l, 16);
}
function betweenSamples(hit) {
  if (hit.kind !== 'trim') return [];
  var upper = null, lower = null;
  hit.curve.impellers.forEach(function (imp) {
    if (imp.diameter_in === hit.upperDiameter) upper = imp;
    if (imp.diameter_in === hit.lowerDiameter) lower = imp;
  });
  if (!upper || !lower) return [];
  var out = [];
  var steps = 24;
  for (var i = 0; i <= steps; i++) {
    var q = hit.qMin + (hit.qMax - hit.qMin) * i / steps;
    var a = DeanRA.headAt(upper.points, q);
    var b = DeanRA.headAt(lower.points, q);
    if (!a || !b) continue;
    out.push({
      q: q,
      h: DeanRA.affinityHead(b.h, a.h, hit.lowerDiameter, hit.upperDiameter, hit.diameter_in)
    });
  }
  return out;
}
document.getElementById('duty').addEventListener('submit', function (ev) {
  ev.preventDefault();
  runDeanSelect();
});
document.querySelectorAll('[data-ex]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var p = btn.getAttribute('data-ex').split(',');
    document.getElementById('sel-q').value = p[0];
    document.getElementById('sel-h').value = p[1];
    runDeanSelect();
  });
});
['sel-q', 'sel-h'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', syncChips);
});
window.addEventListener('resize', function () {
  if (DEAN_LAST && DEAN_LAST.result.covered) drawDeanSelection();
});
fetch('data/dean-ra-curves.json').then(function (r) {
  if (!r.ok) throw new Error('catalog ' + r.status);
  return r.json();
}).then(function (data) {
  DEAN_CATALOG = data;
}).catch(function () {
  var err = document.getElementById('sel-err');
  if (err) err.textContent = 'Could not load the Dean RA catalog.';
});
</script>
</body>
</html>
