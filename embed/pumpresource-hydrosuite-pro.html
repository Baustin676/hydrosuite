<!--
  Paste this in place of the Hydrosuite iframe on
  https://pumpresource.us/hydrosuite-pro/.
  It keeps the Open Full Screen bar. The iframe has no fixed height.
  The script below builds the iframe, so the page editor cannot strip
  its attributes. It never adds a second frame.
  HydroSuite tells this page how tall it is, and the page scrolls once.
  Download PDF asks this page to save the file, so the iframe does not navigate.
-->
<div id="hydrosuite-wrap" style="width: 100%; display: block;">
  <button type="button" onclick="openFullscreen()" style="display: block; width: 100%; height: 40px; margin-top: 0; background-color: #1e293b; color: #ffffff; border: 1px solid #334155; border-radius: 0 0 8px 8px; cursor: pointer; font-size: 14px; font-family: Arial,sans-serif;"> ⛶ Open Full Screen </button>
</div>
<script>
function openFullscreen() {
  var el = document.getElementById('hydrosuite-wrap');
  if (el.requestFullscreen) { el.requestFullscreen(); }
  else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
  else { window.open('https://baustin676.github.io/hydrosuite/', '_blank'); }
}
(function () {
  var wrap = document.getElementById('hydrosuite-wrap');
  if (!wrap) return;
  var bar = wrap.querySelector('button');
  function setUp(f) {
    f.id = 'hydrosuite-frame';
    f.title = 'Dean RA Pump Selector';
    f.setAttribute('scrolling', 'no');
    f.setAttribute('allowfullscreen', 'allowfullscreen');
    f.setAttribute('allow', 'web-share');
    f.style.display = 'block';
    f.style.width = '100%';
    f.style.minHeight = '640px';
    f.style.border = '0';
  }
  var frame = document.getElementById('hydrosuite-frame') || wrap.querySelector('iframe');
  if (frame) {
    setUp(frame);
  } else {
    frame = document.createElement('iframe');
    setUp(frame);
    if (bar) wrap.insertBefore(frame, bar);
    else wrap.appendChild(frame);
  }
  if (wrap.getAttribute('data-hs-ready')) return;
  wrap.setAttribute('data-hs-ready', '1');
  var SOURCE = 'https://baustin676.github.io';
  var lastHeight = 0;
  var told = false;
  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function inFullscreen() {
    return fullscreenElement() === wrap;
  }
  function applyHeight() {
    if (inFullscreen() || !lastHeight) return;
    frame.setAttribute('scrolling', 'no');
    frame.style.height = lastHeight + 'px';
  }
  function enterFullscreenLayout() {
    wrap.style.height = '100%';
    wrap.style.overflow = 'auto';
    wrap.style.background = '#fff';
    if (bar) {
      bar.style.position = 'sticky';
      bar.style.bottom = '0';
    }
  }
  function leaveFullscreenLayout() {
    wrap.style.height = '';
    wrap.style.overflow = '';
    wrap.style.background = '';
    if (bar) {
      bar.style.position = '';
      bar.style.bottom = '';
    }
    applyHeight();
  }
  function bytesFromBase64(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function anchorSave(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function isIos() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function saveDownload(data) {
    if (!data || typeof data.base64 !== 'string' || data.base64.length < 32 || data.base64.length > 12000000) return;
    var name = String(data.filename || 'PumpResource.pdf').replace(/[^A-Za-z0-9._-]+/g, '-');
    if (name.indexOf('.pdf') < 0) name += '.pdf';
    var blob = new Blob([bytesFromBase64(data.base64)], { type: 'application/pdf' });
    var file = null;
    try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) {}
    if (isIos() && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'PumpResource' }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        anchorSave(blob, name);
      });
      return;
    }
    anchorSave(blob, name);
  }
  function announce() {
    try {
      frame.contentWindow.postMessage({ type: 'hydrosuite:ready', download: true }, SOURCE);
    } catch (e) {}
  }
  window.addEventListener('message', function (ev) {
    if (ev.origin !== SOURCE) return;
    if (ev.source !== frame.contentWindow) return;
    var data = ev.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'hydrosuite:height') {
      var height = Number(data.height);
      if (!isFinite(height) || height < 1) return;
      lastHeight = Math.min(50000, Math.ceil(height));
      applyHeight();
      if (!told) { told = true; announce(); }
    } else if (data.type === 'hydrosuite:scroll-to-results') {
      var top = Number(data.top);
      if (!isFinite(top)) top = 0;
      var y = frame.getBoundingClientRect().top + window.pageYOffset + top;
      window.scrollTo(0, Math.max(0, y));
    } else if (data.type === 'hydrosuite:download') {
      saveDownload(data);
    }
  });
  function onFullscreenChange() {
    if (inFullscreen()) enterFullscreenLayout();
    else leaveFullscreenLayout();
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  if (!frame.getAttribute('src')) frame.src = 'https://baustin676.github.io/hydrosuite/';
})();
</script>
